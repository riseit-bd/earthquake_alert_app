# Codemagic sample configuration for a Flutter app
# Refer to https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/ for more information

workflows:
  android-app-release:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Clean Flutter project
        script: |
          flutter clean
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Generate localization files
        script: |
          flutter gen-l10n
      - name: List generated files
        script: |
          ls -R .dart_tool/
      - name: Analyze project
        script: |
          flutter analyze
      - name: Run tests
        script: |
          flutter test
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
